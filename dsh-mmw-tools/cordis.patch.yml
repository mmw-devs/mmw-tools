# dsh-mmw-tools bundle patch
#
# Inserts the plugin row into the profile roster. The bundle is loaded
# as a profile bundle layer (declared by the dsh.bundle.patch field in
# package.json).
#
# Activate:
#   dsh plugin --profile <profile> add file:/path/to/dsh-mmw-tools
#   # then restart DSH
#
# Authentication is delegated to the broker: no OAuth App, no client id and
# no scope list on this machine. See docs/AUTH-BROKER.md.
#
# repoBinding — the DEFAULT repository. A profile can host more than one
#   registered repository; `config.repos` adds selectable entries and the
#   session binds one with `select_repo`. Editing this block does not affect
#   GitHub; it is a client-side default and guard rail.
#
# ⚠️  SSOT WARNING — MIRRORED FACTS
# ─────────────────────────────────
# The following fields MIRROR facts in
# `mmw-devs/ffxiv-race-ops/AGENTS.md`:
#
#     cordis.patch.yml field       AGENTS.md source
#     ───────────────────────     ──────────────────────────────────
#     repoBinding.allowlistPaths  "唯一允许修改: public/data.json"
#     repoBinding.denylistPaths   derived from the "不可改动" list
#     repoBinding.branchPrefix    "content/* 分支前缀"
#     preflight.cmd               "本地校验: npm run validate"
#
# The plugin's `mmw_tools_run` tool fetches AGENTS.md at startup and
# compares it to these fields. A mismatch logs a WARNING but does NOT
# block execution — AGENTS.md is the authority; this file is the cache.
# See docs/OPERATIONS-SYNC.md for the maintenance contract.

- insert:
    - id: mmw-tools
      name: dsh-mmw-tools
      config:
        announceToAgent: true
        enabled: true

        # Where repo_clone puts the checkout and where mmw_tools_run reads
        # AGENTS.md.
        #
        # Deliberately NOT set here: the plugin defaults to
        #   ~/.dsh/workspaces/<repoBinding.owner>/<repoBinding.name>
        # so an install on someone else's machine does not inherit this
        # one's absolute path. Set it only if that default is wrong for a
        # deployment - and when you do, copy the whole config block, because
        # a profile-level override *replaces* the plugin's config instead of
        # merging into it (overriding just this key once wiped repoBinding
        # and every tool failed).
        # workingDir: /absolute/path/to/checkout

        # Auth is delegated to the broker: no OAuth App, no scopes, no
        # user token. See docs/AUTH-BROKER.md.
        brokerUrl: https://race-ops-broker.mmw-team.icu

        # Feishu tool authorization. The auth core owns roles and the route
        # table; this gate only enforces them at call time. Disable it only
        # for an air-gapped install; tools are otherwise denied until login.
        feishu:
          enabled: true
          authServiceUrl: https://mmw-tools.mmw-team.icu
          # How wide the gate reaches.
          #   "mmw-tools" (default) — only this plugin's own tools are
          #     gated; the host's standard tools (read / pwsh / glob / …)
          #     pass through untouched.
          #   "session" — the gate becomes an exclusive allowlist for the
          #     WHOLE session and every non-MMW tool is denied. A DSH profile
          #     is shared by every workspace it hosts, so this strips the
          #     file and shell tools out of all of them. Only set it in a
          #     profile dedicated to this repository.
          gateScope: mmw-tools

        # Which sessions may use these tools.
        #
        # The plugin is loaded per PROFILE, and a profile hosts every
        # workspace opened in it. Without this guard a session started in an
        # unrelated directory still lists the plugin's tools and can drive a
        # registered repository from there.
        #
        # A workspace is managed only when BOTH facts agree:
        #   - the repository registered in auth core, and
        #   - the checkout's `origin` remote resolves to that repository.
        # `.dsh-mmw-tools.yaml` at the repository root is the rule marker and
        # a hint for an otherwise unregistered checkout; it is not an
        # identity. Missing/invalid rules, or a remote/registry mismatch,
        # fail closed (`mismatch`).
        #
        #   onUnavailable: deny  — default: the host gives no working directory
        #     (old profile / an execution with no agent), so refuse the
        #     business tools. `mmw_tools_status` stays callable and reports
        #     the workspace mode and reason.
        #   onUnavailable: allow — explicit fail-open; only for a host whose
        #     service support has been verified.
        #
        # `repo_clone` is the one business exception: it may run in a
        # registered checkout that has no `.git` yet, so the first session can
        # create the checkout. A live checkout is never cloned over.
        workspaceGuard:
          enabled: true
          onUnavailable: deny

        repoBinding:
          owner: mmw-devs
          name: ffxiv-race-ops
          baseBranch: main
          branchPrefix: content/
          allowlistPaths:
            - public/data.json
          denylistPaths:
            - .github/workflows/**
            - schema/**
            - scripts/**
            - constants.js
            - AGENTS.md
            - README.md
            - .pi/**
            - dist/**
          preflight:
            enabled: true
            cmd: npm run validate
            timeoutSeconds: 60
          # `npm run validate` runs scripts/validate-data.ts through tsx,
          # which lives in devDependencies. A fresh clone has no
          # node_modules, so without this bootstrap every commit is
          # refused by its own pre-flight with "tsx: not found".
          # Runs once per working directory, before the first edit.
          bootstrap:
            cmd: npm ci
            whenMissing: node_modules
            timeoutSeconds: 300
name: CI

# Everything here runs offline against the checked-in source. The two
# suites that need a real subprocess (the MCP stdio handshake and the
# git integration suite) are the reason this workflow exists: those
# cannot run in every developer sandbox, so CI is where they get
# exercised on every push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not decoration: path handling differs, and this
        # repository's tooling has already tripped over backslashes once.
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            dsh-mmw-tools/pnpm-lock.yaml
            dsh-mmw-tools/mcp-server/pnpm-lock.yaml

      # The plugin and its MCP child are separate pnpm projects with
      # separate lockfiles; there is no workspace file at the root.
      - name: Install plugin dependencies
        working-directory: dsh-mmw-tools
        run: pnpm install --frozen-lockfile

      - name: Install MCP server dependencies
        working-directory: dsh-mmw-tools/mcp-server
        run: pnpm install --frozen-lockfile

      # Build before check: `check:namespace` asserts that
      # lib/client.js exists and `check:pack` asserts the tarball
      # contains the built artifacts.
      - name: Build MCP server
        working-directory: dsh-mmw-tools/mcp-server
        run: pnpm build

      - name: Build host bundle and client bundle
        working-directory: dsh-mmw-tools
        run: pnpm build:all
      # The committed bundles are what a git install actually runs
      # (docs/PUBLISHING.md): the build steps above just overwrote them in the
      # working tree, so without this check a stale commit passes everything —
      # the suites test the fresh files, and the repository keeps the old ones.
      - name: Committed bundles match the source
        working-directory: dsh-mmw-tools
        run: |
          set -e
          changed=$(git diff --name-only --ignore-cr-at-eol -- lib mcp-server/dist)
          stray=$(git status --porcelain --ignored -- lib mcp-server/dist | sed -n 's/^!! //p' | grep -v node_modules || true)
          if [ -n "$changed" ] || [ -n "$stray" ]; then
            echo "::error::lib/ or mcp-server/dist/ is stale relative to src/. Rebuild and commit the output."
            printf '%s\n' "$changed" "$stray"
            exit 1
          fi

      - name: Typecheck, namespace consistency, unit and integration suites, pack contents
        working-directory: dsh-mmw-tools
        run: pnpm check

      - name: MCP guard and schema suites
        working-directory: dsh-mmw-tools/mcp-server
        run: pnpm test

      - name: MCP server starts over stdio and advertises its tools
        working-directory: dsh-mmw-tools
        run: pnpm test:smoke

      - name: Real-git integration suite
        working-directory: dsh-mmw-tools
        run: pnpm test:integration

      # Keep the generated bundles reachable when a build-related test
      # fails, so a red run can be diagnosed without a local rebuild.
      - name: Upload built bundles
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          path: |
            dsh-mmw-tools/lib
            dsh-mmw-tools/mcp-server/dist
          if-no-files-found: ignore
          retention-days: 7

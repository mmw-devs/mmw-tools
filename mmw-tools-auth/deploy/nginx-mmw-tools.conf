# mmw-tools auth core — public front door.
#
# Only this hostname. The auth process listens on 127.0.0.1:4326 and never sees
# the internet directly. The main mmw-team.icu site and race-ops-broker are
# untouched.
#
# Query strings are deliberately omitted from access logs: the plugin polls
# /v1/login/:id?secret=... and Feishu returns ?code=...&state=...; neither
# belongs in nginx logs.
log_format mmw_tools_noquery '$remote_addr - $remote_user [$time_local] '
                             '"$request_method $uri $server_protocol" $status '
                             '$body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name mmw-tools.mmw-team.icu;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mmw-tools.mmw-team.icu;
    server_tokens off;

    ssl_certificate     /etc/nginx/ssl/mmw-tools/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/mmw-tools/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL_MMWTOOLS:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/mmw-tools-access.log mmw_tools_noquery;
    error_log  /var/log/nginx/mmw-tools-error.log warn;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:4326;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

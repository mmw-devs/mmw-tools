# race-ops GitHub App token broker — public front door.
#
# Only this hostname; the existing mmw-team.icu site is untouched.
# The broker itself listens on 127.0.0.1:8787 and never sees the internet.
#
# Phase 1 (this file): port 80 only, serving ACME challenges so the
# certificate can be issued. Phase 2 appends the 443 block once
# /etc/letsencrypt/live/race-ops-broker.mmw-team.icu/ exists.

server {
    listen 80;
    listen [::]:80;
    server_name race-ops-broker.mmw-team.icu;

    # Certbot webroot for HTTP-01 renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
